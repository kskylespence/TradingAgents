# TradingAgents — local development compose stack.
#
# Brings up a Postgres 16 instance plus the FastAPI app image built from the
# repo-root Dockerfile. Coolify deployments do NOT use this file; production
# uses Neon for Postgres and Coolify-managed persistent volumes.
#
# Usage:
#   cp .env.local.example .env.local   # fill in secrets first
#   docker compose up --build
#
# Licensed under the Apache License, Version 2.0. See LICENSE for terms.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradingagents
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: tradingagents
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingagents"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    environment:
      # Override .env.local so the app always talks to the compose db service.
      DATABASE_URL: "postgresql+asyncpg://tradingagents:devpassword@db:5432/tradingagents"
    volumes:
      - appdata:/data/tradingagents

volumes:
  pgdata:
  appdata:
