[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents-web-backend"
version = "0.1.0"
description = "FastAPI backend for the TradingAgents Web UI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Path-dep on the parent tradingagents package. Pip cannot resolve this
    # from a name in the registry; this declaration is a documentation
    # placeholder. See dev-install.md for the install dance, or use the
    # uv source mapping below.
    "tradingagents",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # passlib 1.7.4 reads bcrypt.__about__.__version__ which was removed in
    # bcrypt 4.x. Without a pin, pip installs bcrypt 5.x and every verify()
    # logs "(trapped) error reading bcrypt version" — and on some host
    # toolchains the fallback path silently fails. Pin to the last 3.x
    # release, which passlib 1.7.4 verifies cleanly. Track passlib's
    # next release for proper bcrypt 4+ support.
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.0",
    "pyjwt>=2.10",
    "cryptography>=44",
    "python-multipart>=0.0.20",
    "httpx[http2]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # Capped below 1.0 deliberately. pytest-asyncio 1.x changed per-test
    # event-loop and fixture finalisation: `test_rate_limit.py` fixtures die
    # with "RuntimeError: There is no current event loop in thread
    # 'MainThread'" and three `test_runs_preflight_probe.py` tests fail. With
    # an uncapped `>=0.24` a fresh install silently resolves to 1.x and the
    # suite goes from all-green to 3 failed / 5 errors. The `pytest` major
    # version is NOT the trigger — 8.x and 9.x behave identically here.
    # Lift the cap only alongside a migration to the 1.x loop-scope API.
    "pytest-asyncio>=0.24,<1.0",
    "pytest-postgresql>=6.1",
    # pytest-postgresql imports psycopg, which needs libpq at *collection*
    # time (the plugin auto-loads via entry points even for tests that never
    # touch Postgres). The [binary] extra vendors libpq into the wheel;
    # without it a machine with no system libpq — e.g. macOS without
    # Homebrew — aborts the whole session before a single test runs.
    "psycopg[binary]>=3.1",
    "anyio>=4.6",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
]

# When using uv (https://docs.astral.sh/uv/), this lets the path-dep resolve
# automatically. Plain pip users follow dev-install.md.
#
# The path is relative to THIS file's directory (web/backend/), so the repo
# root — where the `tradingagents` pyproject.toml lives — is two levels up.
# This previously read `..`, which pointed at `web/` and failed with "does
# not appear to be a Python project". Plain pip never noticed because it
# ignores [tool.uv.sources] entirely.
[tool.uv.sources]
tradingagents = { path = "../..", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-p no:postgresql` disables the pytest-postgresql plugin by default; on
# Windows it tries to import psycopg's libpq at collection time, which
# fails without a system libpq install. Tests that need real Postgres
# should re-enable the plugin via their own conftest or `-p postgresql`.
addopts = "-ra --strict-markers -p no:postgresql"
asyncio_mode = "auto"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
