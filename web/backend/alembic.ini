# Alembic configuration for the TradingAgents web backend.
#
# The async engine and URL are constructed in alembic/env.py from the same
# app.config.Settings used by the running FastAPI app, so DATABASE_URL is
# the single source of truth. The sqlalchemy.url here is only a fallback
# for tools that don't load env.py (e.g. alembic's pure CLI utilities).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Generated migration filenames: 0002_add_thing.py
file_template = %%(rev)s_%%(slug)s
# Overridden by env.py when DATABASE_URL is set.
sqlalchemy.url = sqlite+aiosqlite:///:memory:

[post_write_hooks]
# Leave empty; we don't auto-format generated migrations in v1.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
